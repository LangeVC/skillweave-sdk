name: SDK Contract CI

# Das SDK besitzt die autoritative Wertemenge. Dieser Job stellt sicher, dass
# das SDK SELBST nicht zur zweiten Wahrheit wird:
#   1. Jedes Kern-Schema parst als gueltiges JSON.
#   2. contract/run-state.enum.json ist AUS dem Schema ERZEUGT. Der Generator
#      (scripts/generate_contract.py --check) wird rot, wenn der Extrakt von
#      Hand geaendert wurde. schema_version im Extrakt ist abgeleitet (aus
#      schema_version.toml), nie behauptet.
#
# Konstruktion statt Waechter: ein erzeugtes Artefakt braucht keinen Waechter,
# weil es keinen handschriftlichen Weg in den Baum hat. Der --check ist nur
# der Rueckfall.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-consistency:
    name: Schemas + Contract-Auszug konsistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Schemas als gueltiges JSON pruefen
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for schema in Path("schemas").glob("*.schema.json"):
              json.loads(schema.read_text(encoding="utf-8"))
              print(f"  OK schema: {schema}")
          PY

      - name: Extrakt aus Schema erzeugen (Konstruktion, --check als Rueckfall)
        run: python3 scripts/generate_contract.py --check
