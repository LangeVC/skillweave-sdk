name: SDK Contract CI

# The SDK owns the authoritative value set. This job makes sure the SDK does not
# itself become a second truth:
#   1. Jedes Kern-Schema parst als gueltiges JSON.
#   2. contract/run-state.enum.json is GENERATED FROM the schema. The generator
#      (scripts/generate_contract.py --check) goes red if the extract was edited
#      by hand. schema_version in the extract is derived (from
#      schema_version.toml), nie behauptet.
#
# Konstruktion statt Waechter: ein erzeugtes Artefakt braucht keinen Waechter,
# because it has no hand-written route into the tree. The --check is only the
# fallback.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-consistency:
    name: Schemas + Contract-Auszug konsistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Schemas als gueltiges JSON pruefen
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for schema in Path("src/skillweave_sdk/schemas").glob("*.schema.json"):
              json.loads(schema.read_text(encoding="utf-8"))
              print(f"  OK schema: {schema}")
          PY

      - name: Extrakt aus Schema erzeugen (Konstruktion, --check als Rueckfall)
        run: python3 scripts/generate_contract.py --check
