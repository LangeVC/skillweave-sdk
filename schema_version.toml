# skillweave-sdk — contract authority
#
# This file is the root of the release graph. Every consumer pins a version from
# here; no consumer references "latest" or a branch tip.

[schema]
# Canonical schema version. A breaking change to a core schema raises the major,
# an additive one the minor.
#
# 0.1.0, not 1.0.0: this repository is structure, not a completed cut. The
# GLE-001 schemas are absent, profiles and packs-pro are empty, and the core's
# file precedence is still outstanding. 1.0.0 arrives when the four-way split is
# substantively done.
version = "0.2.0"

[schema_files]
# All 13 schemas in the SDK contract set: 4 core + 9 lifecycle.
evidence = "schemas/evidence.schema.json"
prompt-sequence = "schemas/prompt-sequence.schema.json"
run-state = "schemas/run-state.schema.json"
workflow-context = "schemas/workflow-context.schema.json"
work-profile = "schemas/work-profile.schema.json"
lifecycle-profile = "schemas/lifecycle-profile.schema.json"
deliverable-contract = "schemas/deliverable-contract.schema.json"
evidence-contract = "schemas/evidence-contract.schema.json"
category-pack = "schemas/category-pack.schema.json"
category-taxonomy = "schemas/category-taxonomy.schema.json"
model-provider = "schemas/model-provider.schema.json"
search-provider = "schemas/search-provider.schema.json"
subject-ref = "schemas/subject-ref.schema.json"

[taxonomy]
# The taxonomy value set lives as a schema enum. This section records where. A
# validator needs only that value set, never core access.
run-state-vocabulary = "schemas/run-state.schema.json#/properties/state/enum"
